<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>战斗 hex 演示 · placement-wuxia</title>
<style>
  * { margin:0; padding:0; box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  html,body { width:100%; height:100%; background:#000; overflow:hidden; font-family:"PingFang SC","Microsoft YaHei",sans-serif; touch-action:none; user-select:none; }
  #stage { position:relative; width:100%; height:100%; display:flex; align-items:center; justify-content:center; }
  #cvWrap { position:relative; width:min(100%, calc(100vh * 9 / 16)); aspect-ratio:9/16; }
  #cv { position:absolute; inset:0; width:100%; height:100%; cursor:pointer; }
  #toast { position:absolute; left:50%; top:14%; transform:translateX(-50%); background:#000c; color:#ffe9b8; border:1px solid #8a6a35;
           padding:8px 18px; border-radius:8px; font-size:clamp(11px,2.8vw,14px); z-index:60; opacity:0; transition:opacity .25s; pointer-events:none; }
  #assetGate { position:fixed; left:0; right:0; top:0; display:none; background:#a01818; color:#fff; font:11px monospace;
               padding:4px 8px; z-index:70; pointer-events:none; }
  /* 【T31-FE-B】「角色资源加载失败」页（方案 §6.2）：停在失败页给显式重试，不进入战斗、不切 2D 帧 */
  #char3dGate { position:fixed; inset:0; display:none; align-items:center; justify-content:center; z-index:80;
                background:#0b0f14ee; }
  #char3dGate .box { max-width:78%; padding:18px 22px; border:1px solid #8a6a35; border-radius:10px;
                     background:#151b22; color:#ffe9b8; font:13px/1.6 "PingFang SC","Microsoft YaHei",sans-serif; text-align:center; }
  #char3dGate button { margin-top:12px; padding:7px 22px; border:1px solid #c9a25e; border-radius:8px;
                       background:#2a2118; color:#ffe9b8; font:13px "PingFang SC","Microsoft YaHei",sans-serif; cursor:pointer; }
</style>
</head>
<body>
<div id="stage">
  <div id="cvWrap">
    <canvas id="cv"></canvas>
    <div id="toast"></div>
  <div id="assetGate"></div>
  </div>
</div>
<div id="char3dGate"><div class="box"><div id="char3dGateMsg">角色资源加载失败</div><button id="char3dRetry">重试</button></div></div>
<script src="bundle.js?v=v1789442853299"></script>
<div id="verTag" style="position:fixed;right:4px;top:4px;font:9px monospace;color:#8888;z-index:99">v1789442853299</div>
</body>
</html>
