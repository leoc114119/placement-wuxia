<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>家场景垂直切片 · placement-wuxia</title>
<style>
  * { margin:0; padding:0; box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  html,body { width:100%; height:100%; background:#000; overflow:hidden; font-family:"PingFang SC","Microsoft YaHei",sans-serif; touch-action:none; user-select:none; }
  /* 禁原生图片拖拽：按住轻微移动会触发 dragstart，场景图半透明快照跟随鼠标（"整个家的虚影"根因） */
  img { -webkit-user-drag:none; user-select:none; -webkit-touch-callout:none; }
  #stage { position:relative; width:100%; height:100%; background:#000; display:flex; align-items:center; justify-content:center; }

  /* 场景舞台：等距图居中，保持比例 */
  #sceneWrap { position:relative; height:100%; aspect-ratio:9/16; max-width:100%; }
  #scene { position:absolute; inset:0; width:100%; height:100%; object-fit:cover; image-rendering:auto; }

  /* 主角 */
  #hero { position:absolute; height:19.6%; left:50%; top:55%; transform:translate(-50%,-92%); pointer-events:none;
         image-rendering:auto; z-index:5; }
  #shadow { position:absolute; width:5.5%; aspect-ratio:2.2/1; background:radial-gradient(ellipse, #00000088, transparent 68%); transform:translate(-50%,-50%); z-index:4; pointer-events:none; }

  /* ===== UI 覆盖层 ===== */
  .ui { position:absolute; z-index:10; }

  /* ① 顶部栏（两行式：行1=我是谁+我在哪+胶囊预留 · 行2=货币带）Leo 2026-09-01 布局 */
  #topbar { top:0; left:0; right:0; height:13.5%; background:linear-gradient(#000d,#000a 70%,transparent); display:flex; flex-direction:column; padding:1.2% 2.5% 0; gap:1%; }
  #tbRow1 { flex:1.6; display:flex; align-items:center; gap:2.2%; min-height:0; }
  #tbRow2 { flex:1; display:flex; align-items:center; gap:4%; padding-left:1%; min-height:0; }
  #avatarWrap { display:flex; flex-direction:column; align-items:center; gap:2px; }
  #avatar { width:clamp(38px,7.4vh,64px); aspect-ratio:1; border-radius:50%; border:2px solid #D4AF37; background:#3a2f22;
            display:flex; align-items:center; justify-content:center; font-size:clamp(12px,2.6vh,20px); color:#e8d9b0; }
  #ageTag { font-size:clamp(8px,1.7vh,12px); color:#e8d9b0; background:#241a10cc; border:1px solid #7a5c2e88; border-radius:6px; padding:1px 6px; white-space:nowrap; text-shadow:0 1px 2px #000; }
  #statWrap { display:flex; flex-direction:column; gap:5%; width:clamp(90px,17vh,150px); }
  #pname { color:#ffe9a8; font-size:clamp(11px,2.3vh,16px); letter-spacing:.1em; text-shadow:0 1px 2px #000; line-height:1.1; }
  .bar { height:clamp(6px,1.4vh,11px); background:#1c1410; border:1px solid #7a5c2e; border-radius:4px; overflow:hidden; }
  .bar i { display:block; height:100%; border-radius:3px; }
  .bar.hp i { width:86%; background:linear-gradient(#c8403a,#8e2a26); }
  .bar.mp i { width:35%; background:linear-gradient(#3a7bc8,#26568e); }
  #locPill { margin-left:auto; color:#f0e2b6; background:#241a10cc; border:1px solid #7a5c2e88; border-radius:14px;
             padding:3px 10px; font-size:clamp(9px,2vh,14px); white-space:nowrap; text-shadow:0 1px 2px #000; }
  /* 时辰牌：竖排鎏金小木牌（网金口径保留） */
  #scPlate { writing-mode:vertical-rl; letter-spacing:.15em; color:#ffe9b8; background:linear-gradient(160deg,#5a3a22,#3d2716 55%,#2c1c0f);
             border:1px solid #8a6a35; border-radius:6px; padding:6px 4px; font-size:clamp(9px,1.9vh,14px);
             box-shadow:inset 0 0 8px #00000066, 0 1px 4px #000a; text-shadow:0 1px 2px #000; position:relative; }
  #scPlate::before { content:""; position:absolute; width:4px; height:4px; background:radial-gradient(#e8c56a,#8a6a35); border-radius:50%; left:50%; transform:translateX(-50%); top:2px; }
  /* 微信胶囊预留（真机右上固定，此处仅占位示意） */
  #wxSeat { margin-left:.5%; display:flex; align-items:center; gap:8px; background:#00000066; border:1px solid #ffffff22; border-radius:16px; padding:4px 10px; color:#ffffff99; font-size:clamp(10px,2vh,14px); }
  /* 货币带：图标+数字 */
  .curr { display:flex; align-items:center; gap:5px; color:#ffe9a8; font-size:clamp(10px,2.1vh,15px); text-shadow:0 1px 2px #000;
          background:#241a10cc; border:1px solid #7a5c2e55; border-radius:12px; padding:2px 10px 2px 4px; }
  .curr img { height:clamp(18px,3.6vh,28px); aspect-ratio:1; object-fit:contain; }

  /* ② 左侧场景驱动按钮（竖排鎏金木牌） */
  #sceneBtns { left:1.5%; top:22%; display:flex; flex-direction:column; gap:10px; }
  .woodBtn { writing-mode:vertical-rl; letter-spacing:.35em; padding:12px 7px; color:#ffe9b8; cursor:pointer;
             background:linear-gradient(160deg,#5a3a22,#3d2716 55%,#2c1c0f); border:1px solid #8a6a35; border-radius:8px;
             box-shadow:inset 0 0 0 1px #00000088, inset 0 0 12px #00000066, 0 2px 6px #000a, 0 0 0 1px #000;
             font-size:clamp(12px,3vw,17px); text-shadow:0 1px 2px #000; position:relative; transition:transform .08s; }
  .woodBtn::before, .woodBtn::after { content:""; position:absolute; width:6px; height:6px; background:radial-gradient(#e8c56a,#8a6a35); border-radius:50%; left:50%; transform:translateX(-50%); }
  .woodBtn::before { top:3px; } .woodBtn::after { bottom:3px; }
  .woodBtn:active { transform:scale(.94); }
  .woodBtn small { writing-mode:horizontal-tb; letter-spacing:0; font-size:9px; color:#c9b078; display:block; text-align:center; margin-top:8px; }

  /* ④ 右侧任务区 */
  #questBox { right:1.5%; top:22%; width:24%; background:linear-gradient(175deg,#efe4c8f2,#dcc9a0ee); border:1px solid #8a6a35; border-radius:10px;
              box-shadow:inset 0 0 0 1px #fff8, 0 0 0 1px #000, 0 3px 10px #000a; padding:8px; color:#3a2c18; }
  #questBox h4 { font-size:clamp(10px,2.4vw,14px); color:#6b4a1c; border-bottom:1px dashed #b49a68; padding-bottom:4px; margin-bottom:6px; letter-spacing:.15em; }
  .quest { font-size:clamp(9px,2.1vw,13px); line-height:1.45; margin-bottom:6px; cursor:pointer; background:#fff6; border:1px solid #b49a6866; border-radius:6px; padding:5px 6px; }
  .quest:active { background:#ffe9b8; }
  .quest em { font-style:normal; color:#a33; }
  .quest .go { display:inline-block; margin-top:2px; font-size:.85em; color:#2a6e3e; }

  /* ⑤ 底部五 Tab */
  #tabbar { bottom:0; left:0; right:0; height:9.5%; background:linear-gradient(transparent,#0009 25%,#000d); display:flex; align-items:stretch; padding:0 2%; gap:2%; }
  .tab { flex:1; display:flex; align-items:center; justify-content:center; color:#d9c896; font-size:clamp(11px,2.9vw,18px); cursor:pointer;
         letter-spacing:.12em; text-shadow:0 1px 3px #000; border-radius:8px 8px 0 0; position:relative; }
  .tab:active { color:#ffe9b8; background:#5a3a2233; }
  .tab.on { color:#ffe9b8; }
  .tab.on::after { content:""; position:absolute; left:22%; right:22%; bottom:8%; height:3px; background:linear-gradient(90deg,transparent,#e8c56a,transparent); border-radius:2px; }

  /* 弹窗（绢帛卷轴风） */
  #modal { position:absolute; inset:0; z-index:50; background:#000a; display:none; align-items:center; justify-content:center; }
  #modal.show { display:flex; }
  #sheet { width:78%; max-width:420px; background:linear-gradient(178deg,#efe4c8,#e2d2ac 60%,#d8c49a); border-radius:12px; position:relative;
           box-shadow:0 0 0 1px #000, 0 0 0 3px #8a6a35, 0 0 0 4px #000, 0 12px 40px #000c; padding:7% 8%; color:#3a2c18; }
  #sheet::before, #sheet::after { content:""; position:absolute; top:-10px; bottom:-10px; width:14px; background:linear-gradient(90deg,#4a3категор20,#6b4a2a 40%,#8a6a40 60%,#3a281a); border-radius:7px; box-shadow:0 0 0 1px #000, inset 0 0 6px #0008; }
  #sheet::before { left:-16px; } #sheet::after { right:-16px; }
  #sheet h3 { text-align:center; letter-spacing:.5em; text-indent:.5em; color:#5a3a10; font-size:clamp(16px,4.5vw,22px); margin-bottom:4%; }
  #sheet .sub { text-align:center; font-size:clamp(10px,2.6vw,13px); color:#7a6238; margin-bottom:5%; }
  #sheet p { font-size:clamp(11px,2.9vw,14px); line-height:1.7; color:#4a3a20; margin-bottom:5%; }
  #sheet .row { display:flex; gap:8px; }
  #sheet button { flex:1; padding:10px 0; border:none; border-radius:8px; font-size:clamp(12px,3.2vw,15px); cursor:pointer; letter-spacing:.2em; text-indent:.2em; }
  #sheet .ok { background:linear-gradient(#7a5a2e,#5a3e1c); color:#ffe9b8; box-shadow:inset 0 1px 0 #ffffff44, 0 2px 4px #0008; }
  #sheet .no { background:#c9bfa4; color:#5a4c30; }
  #closeX { position:absolute; top:-12px; right:-12px; width:34px; height:34px; border-radius:50%; border:1px solid #8a6a35; background:#241a10; color:#ffe9b8; font-size:16px; cursor:pointer; box-shadow:0 0 0 1px #000; }

  /* toast */
  #toast { position:absolute; left:50%; top:14%; transform:translateX(-50%); background:#000c; color:#ffe9b8; border:1px solid #8a6a35;
           padding:8px 18px; border-radius:8px; font-size:clamp(11px,2.8vw,14px); z-index:60; opacity:0; transition:opacity .25s; pointer-events:none; }
</style>
</head>
<body>
<div id="stage">
  <div id="sceneWrap">
    <img id="scene" src="scene_web.jpg" alt="scene" draggable="false">
    <div id="shadow"></div>
    <img id="hero" src="frames_v2/idle_down.png?v=v8" alt="hero" draggable="false">

    <!-- ① 顶部栏（两行式 · Leo 2026-09-01 布局） -->
    <div class="ui" id="topbar">
      <div id="tbRow1">
        <div id="avatarWrap">
          <div id="avatar">侠</div>
          <div id="ageTag">8岁 1月</div>
        </div>
        <div id="statWrap">
          <div id="pname">小虾米</div>
          <div class="bar hp"><i></i></div>
          <div class="bar mp"><i></i></div>
        </div>
        <div id="locPill">📍 家中</div>
        <div id="scPlate">辰时</div>
        <div id="wxSeat"><span>•••</span><span>◎</span></div>
      </div>
      <div id="tbRow2">
        <span class="curr"><img src="icons/icon_shizhan.png" alt="实战">8888</span>
        <span class="curr"><img src="icons/icon_xuedian.png" alt="学点">8888</span>
        <span class="curr"><img src="icons/icon_yinliang.png" alt="银两">8888</span>
      </div>
    </div>

    <!-- ② 左侧场景驱动按钮（家：闭关/打木人/打坐） -->
    <div class="ui" id="sceneBtns">
      <div class="woodBtn" data-act="biguan">闭关</div>
      <div class="woodBtn" data-act="muren">木人</div>
      <div class="woodBtn" data-act="dazuo">打坐</div>
    </div>

    <!-- ④ 右侧任务区 -->
    <div class="ui" id="questBox">
      <h4>任 务</h4>
      <div class="quest" onclick="toast('自动寻路：演示版暂未接入')">初入江湖 · 拜访铁匠<em>（未完成）</em><br><span class="go">▸ 点击自动寻路</span></div>
      <div class="quest" onclick="toast('自动寻路：演示版暂未接入')">打扫屋子<em>（进行中）</em><br><span class="go">▸ 点击自动寻路</span></div>
    </div>

    <!-- ⑤ 底部五 Tab -->
    <div class="ui" id="tabbar">
      <div class="tab" data-t="角色">角色</div>
      <div class="tab" data-t="装备">装备</div>
      <div class="tab" data-t="江湖历练">江湖历练</div>
      <div class="tab" data-t="武学">武学</div>
      <div class="tab" data-t="聊天">聊天</div>
    </div>

    <!-- 绢帛弹窗 -->
    <div id="modal" onclick="if(event.target===this)closeModal()">
      <div id="sheet">
        <button id="closeX" onclick="closeModal()">✕</button>
        <h3 id="mTitle">闭关</h3>
        <div class="sub" id="mSub">家中静修 · 离线收益</div>
        <p id="mBody">闭关期间角色进入离线闯关状态，可设置闯关武功，离线时长直接转化为武功熟练度与阅历。</p>
        <div class="row">
          <button class="no" onclick="closeModal()">取消</button>
          <button class="ok" onclick="startAct()">开始</button>
        </div>
      </div>
    </div>

    <div id="toast"></div>
  </div>
</div>

<script>
/* ===== 素材帧 ===== */
const V = 'v8'; // 资源版本号（防浏览器缓存）· v8=头归一+去边修复帧
const FRAMES = {
  down: { seq:[0,1,2,3].map(i=>`frames_v2/walk_down_${i}.png?v=${V}`) },
  up:   { seq:[0,1,2,3].map(i=>`frames_v2/walk_up_${i}.png?v=${V}`) },
  left: { seq:[0,1,2,3].map(i=>`frames_v2/walk_left_${i}.png?v=${V}`) },
  right:{ seq:[0,1,2,3].map(i=>`frames_v2/walk_right_${i}.png?v=${V}`) },
};
const IDLE = { down:`frames_v2/idle_down.png?v=${V}`, left:`frames_v2/idle_left.png?v=${V}`, right:`frames_v2/idle_right.png?v=${V}`, up:`frames_v2/idle_up.png?v=${V}` };

/* 帧预解码：全部帧 decode 完才开播，消除换帧解码期闪烁/虚影（L 环反馈②防御） */
const ALL_URLS = [...Object.values(FRAMES).flatMap(F=>F.seq), ...Object.values(IDLE)];
const DECODE_READY = Promise.all(ALL_URLS.map(u=>{ const im=new Image(); im.src=u; return im.decode().catch(()=>{}); }));

/* 画布几何：整数像素定位（亚像素层抖动会呈"虚影"），resize 时刷新 */
let wrapRect = null;
function refreshRect(){ wrapRect = document.getElementById('sceneWrap').getBoundingClientRect(); }
window.addEventListener('resize', refreshRect);
let flipNow = false;
const hero = document.getElementById('hero');
const shadowEl = document.getElementById('shadow');

/* ===== 状态 ===== */
let pos = { x:.50, y:.58 };
let target = null;
let dir = 'down';
let lastTick = 0;
let moving = false;

/* 可行走范围（菱形地板区域） */
const WALK = { x0:.28, y0:.30, x1:.72, y1:.86 };

function setDir(dx, dy){
  dir = Math.abs(dx) > Math.abs(dy) ? (dx>0?'right':'left') : (dy>0?'down':'up');
}

/* ===== 主循环 ===== */
const SPEED = .18;
function loop(t){
  const dt = Math.min(.05, (t - lastTick)/1000 || 0); lastTick = t;
  if(target){
    const dx = target.x - pos.x, dy = target.y - pos.y;
    const dist = Math.hypot(dx, dy);
    if(dist < .008){ target = null; moving = false; }
    else{
      setDir(dx, dy); moving = true;
      const step = SPEED * dt;
      pos.x += dx/dist * Math.min(step, dist);
      pos.y += dy/dist * Math.min(step, dist);
    }
  } else moving = false;

  // 伪2.5D：行走时轻微上下颠簸（步伐感），静止时呼吸静止
  const bob = 0; // AI帧自带步伐感，不再叠加程序bob（防抖动叠加）

  // 影子随 bob 微缩（跳跃感的投影呼应）
  const R = wrapRect || (refreshRect(), wrapRect);
  const pxX = Math.round(pos.x*R.width), pxY = Math.round(pos.y*R.height);
  hero.style.left = pxX+'px';
  hero.style.top  = Math.round(pos.y*R.height - bob*0.06*R.height)+'px';
  hero.style.height = Math.round(R.height*0.196)+'px';  // 高度定尺：新帧人物占画布80%，0.196×0.8≈15.7%屏高不变
  shadowEl.style.left = pxX+'px';
  shadowEl.style.top  = pxY+'px';

  // 动画：移动=4帧循环；静止=独立idle帧（站立双脚并拢）
  if(moving){
    const F = FRAMES[dir];
    flipNow = !!F.flip;
    const fi = F.seq[Math.floor(t/180) % F.seq.length];
    hero.src = fi;
  } else {
    flipNow = false;
    hero.src = IDLE[dir];
  }
  hero.style.transform = 'translate(-50%,-92%)' + (flipNow ? ' scaleX(-1)' : '');  // 脚底=画布93.75%，-92%≈原脚底落点
  requestAnimationFrame(loop);
}
DECODE_READY.then(()=>{ refreshRect(); requestAnimationFrame(loop); });

/* ===== 点击/触摸移动 ===== */
const wrap = document.getElementById('sceneWrap');
document.addEventListener('dragstart', e => e.preventDefault());  // 双保险：全局掐断拖拽
function onPoint(e){
  if(e.target.closest('.ui') || e.target.closest('#modal')) return;  // UI 区域不触发移动
  const r = wrap.getBoundingClientRect();
  const cx = (e.touches? e.touches[0].clientX : e.clientX) - r.left;
  const cy = (e.touches? e.touches[0].clientY : e.clientY) - r.top;
  let x = cx / r.width, y = cy / r.height;
  // 钳制到可行走区
  x = Math.max(WALK.x0, Math.min(WALK.x1, x));
  y = Math.max(WALK.y0, Math.min(WALK.y1, y));
  target = { x, y };
}
wrap.addEventListener('pointerdown', onPoint);

/* ===== 场景按钮 → 绢帛弹窗 ===== */
const ACTS = {
  biguan:{ title:'闭 关', sub:'家中静修 · 离线收益', body:'进入离线闯关状态：可设置闯关武功，离线时长转化为武功熟练度与阅历。醒来自取收益。（演示占位）' },
  muren:{ title:'打木人', sub:'练武 · 消耗体力', body:'与木人桩切磋，快速获得武学熟练度与少量实战经验。（正式版木人巷每日限次高额学点）' },
  dazuo:{ title:'打 坐', sub:'调息 · 治疗伤势', body:'静坐调息恢复气血内力，兼修心性。受伤状态下的主要治疗手段。（演示占位）' },
};
document.querySelectorAll('.woodBtn').forEach(b=>{
  b.addEventListener('click', ()=>{
    const a = ACTS[b.dataset.act];
    document.getElementById('mTitle').textContent = a.title;
    document.getElementById('mSub').textContent = a.sub;
    document.getElementById('mBody').textContent = a.body;
    document.getElementById('modal').classList.add('show');
    target = null;  // 打断移动
  });
});
function closeModal(){ document.getElementById('modal').classList.remove('show'); }
function startAct(){ closeModal(); toast('演示版：机制未接入'); }

/* ===== 底部 Tab ===== */
document.querySelectorAll('.tab').forEach(t=>{
  t.addEventListener('click', ()=>{
    document.querySelectorAll('.tab').forEach(x=>x.classList.remove('on'));
    t.classList.add('on');
    toast(t.dataset.t + '（演示占位）');
  });
});

function toast(msg){
  const el = document.getElementById('toast');
  el.textContent = msg; el.style.opacity = 1;
  clearTimeout(el._t); el._t = setTimeout(()=> el.style.opacity = 0, 1400);
}
</script>
</body>
</html>
